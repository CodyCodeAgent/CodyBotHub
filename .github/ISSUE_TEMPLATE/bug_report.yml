name: Bug report
description: 报告可复现的问题；安全漏洞请使用私密漏洞报告
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿在公开 Issue 中提交令牌、飞书 App Secret、日志中的个人信息或安全漏洞细节。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小复现，并将配置与日志脱敏。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交号
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Node/pnpm 版本、所用 Agent Runtime；不要包含凭据。
